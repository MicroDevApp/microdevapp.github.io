<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Перегляд</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 16px;
    }

    /* Размытый постер как фон страницы */
    .bg {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-size: cover;
        background-position: center;
        filter: blur(2.5em);
        transform: scale(1.1);
        z-index: 0;
        opacity: 0.5;
    }

    .bg-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 60%);
        z-index: 1;
    }

    .page {
        position: relative;
        z-index: 2;
        padding: 3em;
    }

    .title {
        font-size: 2.4em;
        font-weight: 300;
        margin-bottom: 1.5em;
    }

    .empty-state {
        position: relative;
        z-index: 2;
        padding: 3em;
        color: rgba(255,255,255,0.5);
        font-size: 1.3em;
    }

    /* --- Результаты поиска --- */
    .results-title {
        font-size: 1.2em;
        color: rgba(255,255,255,0.6);
        margin-bottom: 1.2em;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4em 0;
        color: rgba(255,255,255,0.6);
        font-size: 1.1em;
    }

    .spinner {
        width: 3em;
        height: 3em;
        border: 0.3em solid rgba(255,255,255,0.15);
        border-top-color: #fff;
        border-radius: 50%;
        margin-bottom: 1.2em;
        animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .error-state, .empty-results {
        padding: 2em 0;
        color: rgba(255,255,255,0.5);
        font-size: 1.1em;
    }

    .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5em;
    }

    .card {
        width: 11em;
        cursor: pointer;
        outline: none;
        border-radius: 0.6em;
        padding: 0.3em;
        border: 0.15em solid transparent;
    }

    .card:focus {
        border-color: #fff;
    }

    .card__poster {
        width: 100%;
        height: 16em;
        border-radius: 0.5em;
        background: rgba(255,255,255,0.1) center / cover no-repeat;
        margin-bottom: 0.6em;
    }

    .card__title {
        font-size: 0.95em;
        line-height: 1.3em;
        color: #fff;
        text-align: center;
    }

    .card__year {
        font-size: 0.85em;
        color: rgba(255,255,255,0.5);
        text-align: center;
    }
</style>
</head>
<body>

<div id="root"></div>

<script>
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name) || '';
    }

    var title  = getParam('title');
    var poster = getParam('poster');

    var root = document.getElementById('root');
    var cards = [];

    if (!title) {
        root.innerHTML = '<div class="empty-state">Дані про фільм/серіал не передані</div>';
    } else {
        var bgHtml = poster ? '<div class="bg" style="background-image:url(\'' + poster + '\')"></div><div class="bg-overlay"></div>' : '';

        root.innerHTML =
            bgHtml +
            '<div class="page">' +
                '<div class="title">' + title + '</div>' +
                '<div class="results-title">Результати пошуку</div>' +
                '<div id="searchArea"></div>' +
            '</div>';

        runSearch(title);
    }

    // --- Поиск и парсинг hdrezka ---
    var PROXY = 'https://api.allorigins.win/raw?url=';

    function showLoading(area) {
        area.innerHTML =
            '<div class="loading">' +
                '<div class="spinner"></div>' +
                '<div>Шукаємо...</div>' +
            '</div>';
    }

    function showError(area, msg) {
        area.innerHTML = '<div class="error-state">' + msg + '</div>';
    }

    function showEmptyResults(area) {
        area.innerHTML = '<div class="empty-results">Нічого не знайдено</div>';
    }

    function parseResults(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var nodes = doc.querySelectorAll('.postItem');
        var items = [];

        nodes.forEach(function (node) {
            var linkEl = node.querySelector('.postItem-title a');
            var imgEl = node.querySelector('.posterBg img');
            var miscEl = node.querySelector('.misc');

            if (!linkEl) return;

            var itemTitle = linkEl.textContent.trim();
            var link = linkEl.getAttribute('href') || '';
            var itemPoster = imgEl ? (imgEl.getAttribute('data-src') || imgEl.getAttribute('src') || '') : '';

            if (itemPoster && itemPoster.indexOf('http') !== 0) {
                itemPoster = 'https://hdrezka.inc' + itemPoster;
            }

            var misc = miscEl ? miscEl.textContent.trim() : '';
            var year = (misc.match(/\d{4}/) || [''])[0];

            items.push({ title: itemTitle, link: link, poster: itemPoster, year: year });
        });

        return items;
    }

    function renderResults(area, items) {
        if (!items.length) {
            showEmptyResults(area);
            return;
        }

        var html = '<div class="grid">';

        items.forEach(function (item, i) {
            html +=
                '<div class="card" tabindex="0" data-index="' + i + '" data-link="' + item.link + '">' +
                    '<div class="card__poster" style="background-image:url(\'' + item.poster + '\')"></div>' +
                    '<div class="card__title">' + item.title + '</div>' +
                    (item.year ? '<div class="card__year">' + item.year + '</div>' : '') +
                '</div>';
        });

        html += '</div>';
        area.innerHTML = html;

        cards = Array.prototype.slice.call(area.querySelectorAll('.card'));

        cards.forEach(function (card) {
            card.addEventListener('click', function () {
                var link = card.getAttribute('data-link');
                window.parent.postMessage({ type: 'lampa:openLink', url: link }, '*');
            });
        });

        if (cards.length) cards[0].focus();
    }

    function runSearch(query) {
        var area = document.getElementById('searchArea');
        showLoading(area);

        var searchUrl = 'https://hdrezka.inc/search/' + encodeURIComponent(query);
        var fullUrl = PROXY + encodeURIComponent(searchUrl);

        console.log('[search] запрос к:', fullUrl);

        fetch(fullUrl)
            .then(function (res) {
                console.log('[search] HTTP статус:', res.status, res.statusText);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
            })
            .then(function (html) {
                console.log('[search] получено байт:', html.length);
                console.log('[search] первые 500 символов ответа:', html.slice(0, 500));

                var items = parseResults(html);
                console.log('[search] найдено результатов:', items.length);

                renderResults(area, items);
            })
            .catch(function (err) {
                console.error('[search] ошибка:', err);
                showError(area, 'Помилка завантаження результатів. Спробуйте ще раз.');
            });
    }

    // --- Навигация пультом ---
    document.addEventListener('keydown', function (e) {
        var code = e.keyCode;

        if (code === 27 || code === 461 || code === 10009) {
            window.parent.postMessage({ type: 'lampa:back' }, '*');
            e.preventDefault();
            return;
        }

        if (!cards.length) return;

        var active = document.activeElement;
        var idx = cards.indexOf(active);
        if (idx === -1) return;

        var grid = document.querySelector('.grid');
        var cols = Math.floor(grid.clientWidth / (cards[0].offsetWidth + 24)) || 1;

        if (code === 39) { if (cards[idx + 1]) cards[idx + 1].focus(); e.preventDefault(); }
        if (code === 37) { if (cards[idx - 1]) cards[idx - 1].focus(); e.preventDefault(); }
        if (code === 40) { if (cards[idx + cols]) cards[idx + cols].focus(); e.preventDefault(); }
        if (code === 38) { if (cards[idx - cols]) cards[idx - cols].focus(); e.preventDefault(); }
        if (code === 13) { active.click(); e.preventDefault(); }
    });
</script>

</body>
</html>
