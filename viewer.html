<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Перегляд</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 16px;
        height: 100%;
        overflow: hidden;
        position: relative;
    }

    /* Размытый постер как фон страницы */
    .bg {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-size: cover;
        background-position: center;
        filter: blur(2.5em);
        transform: scale(1.1); /* чтобы блюр не давал светлые края */
        z-index: 0;
        opacity: 0.5;
    }

    .bg-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
        z-index: 1;
    }

    .page {
        position: relative;
        z-index: 2;
        padding: 3em;
    }

    .title {
        font-size: 2.4em;
        font-weight: 300;
    }

    .empty-state {
        position: relative;
        z-index: 2;
        padding: 3em;
        color: rgba(255,255,255,0.5);
        font-size: 1.3em;
    }
</style>
</head>
<body>

<div id="root"></div>

<script>
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name) || '';
    }

    var title  = getParam('title');
    var poster = getParam('poster');

    var root = document.getElementById('root');

    if (!title) {
        root.innerHTML = '<div class="empty-state">Дані про фільм/серіал не передані</div>';
    } else {
        var bgHtml = poster ? '<div class="bg" style="background-image:url(\'' + poster + '\')"></div><div class="bg-overlay"></div>' : '';

        root.innerHTML =
            bgHtml +
            '<div class="page">' +
                '<div class="title">' + title + '</div>' +
            '</div>';
    }

    document.addEventListener('keydown', function (e) {
        var code = e.keyCode;
        if (code === 27 || code === 461 || code === 10009) {
            window.parent.postMessage({ type: 'lampa:back' }, '*');
            e.preventDefault();
        }
    });
</script>

</body>
</html>
