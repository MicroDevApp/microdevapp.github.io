<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Привіт</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 16px;
    }

    .page {
        padding: 3em;
    }

    .message {
        font-size: 1.4em;
        margin-bottom: 1.5em;
        min-height: 1.5em;
        color: rgba(255,255,255,0.7);
    }

    .buttons {
        display: flex;
    }

    .btn {
        padding: 0.9em 1.3em;
        border-radius: 0.7em;
        background: rgba(255,255,255,0.1);
        color: #fff;
        font-size: 1.2em;
        border: none;
        cursor: pointer;
        outline: none;
        margin-right: 0.8em;
    }

    .btn:focus {
        background: #fff;
        color: #000;
    }

    /* --- Бокове меню розділів --- */
    .side-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 40;
    }

    .side-overlay.active {
        display: block;
    }

    .side-menu {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 16em;
        background: #1e1e24;
        z-index: 41;
        padding: 2em 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
    }

    .side-menu.active {
        transform: translateX(0);
    }

    .side-menu__title {
        font-size: 1em;
        color: rgba(255,255,255,0.4);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0 1.5em 1em;
    }

    .side-menu__item {
        display: block;
        width: 100%;
        text-align: left;
        padding: 0.9em 1.5em;
        background: none;
        color: #fff;
        font-size: 1.2em;
        border: none;
        cursor: pointer;
        outline: none;
        border-left: 0.2em solid transparent;
    }

    .side-menu__item:focus {
        background: rgba(255,255,255,0.1);
        border-left-color: #fff;
    }

    /* --- Попап паролю --- */
    .overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 50;
        align-items: center;
        justify-content: center;
    }

    .overlay.active {
        display: flex;
    }

    .popup {
        background: #262829;
        border-radius: 1em;
        padding: 2em;
        min-width: 18em;
    }

    .popup__title {
        font-size: 1.8em;
        font-weight: 300;
        margin-bottom: 1em;
    }

    .popup__input {
        width: 100%;
        padding: 0.7em 1em;
        border-radius: 0.5em;
        border: 0.12em solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.07);
        color: #fff;
        font-size: 1.1em;
        outline: none;
        margin-bottom: 1.2em;
    }

    .popup__input:focus {
        border-color: #fff;
    }

    .popup__error {
        color: #e74c3c;
        font-size: 1em;
        margin-bottom: 1em;
        min-height: 1.2em;
    }

    .popup__footer {
        display: flex;
    }
</style>
</head>
<body>

<div class="page">
    <div class="message" id="message">Оберіть дію</div>
    <div class="buttons">
        <button class="btn" id="btnSections">Обрати розділ</button>
        <button class="btn" id="btn2">Кнопка 2</button>
        <button class="btn" id="btnLogin">Вхід</button>
    </div>
</div>

<!-- Бокове меню -->
<div class="side-overlay" id="sideOverlay"></div>
<div class="side-menu" id="sideMenu">
    <div class="side-menu__title">Оберіть розділ</div>
    <button class="side-menu__item" data-section="1">Розділ 1</button>
    <button class="side-menu__item" data-section="2">Розділ 2</button>
    <button class="side-menu__item" data-section="3">Розділ 3</button>
    <button class="side-menu__item" data-section="4">Розділ 4</button>
    <button class="side-menu__item" data-section="5">Розділ 5</button>
</div>

<!-- Попап паролю -->
<div class="overlay" id="overlay">
    <div class="popup">
        <div class="popup__title">Вхід</div>
        <input class="popup__input" id="passInput" type="password" placeholder="Введіть пароль">
        <div class="popup__error" id="passError"></div>
        <div class="popup__footer">
            <button class="btn" id="btnConfirm" style="margin-right:0.8em">Увійти</button>
            <button class="btn" id="btnCancel">Скасувати</button>
        </div>
    </div>
</div>

<script>
    var message    = document.getElementById('message');
    var btnSections = document.getElementById('btnSections');
    var btn2       = document.getElementById('btn2');
    var btnLogin   = document.getElementById('btnLogin');

    var sideOverlay = document.getElementById('sideOverlay');
    var sideMenu    = document.getElementById('sideMenu');
    var sideItems   = Array.prototype.slice.call(document.querySelectorAll('.side-menu__item'));

    var overlay    = document.getElementById('overlay');
    var passInput  = document.getElementById('passInput');
    var passError  = document.getElementById('passError');
    var btnConfirm = document.getElementById('btnConfirm');
    var btnCancel  = document.getElementById('btnCancel');

    var PASSWORD = '123';
    var mainButtons = [btnSections, btn2, btnLogin];
    var popupFocusable = [passInput, btnConfirm, btnCancel];

    // --- Головні кнопки ---
    btn2.addEventListener('click', function () {
        message.textContent = 'Ви натиснули Кнопку 2!';
    });

    btnLogin.addEventListener('click', openPopup);
    btnSections.addEventListener('click', openSideMenu);

    // --- Бокове меню ---
    function openSideMenu() {
        sideOverlay.classList.add('active');
        sideMenu.classList.add('active');
        setTimeout(function () { sideItems[0].focus(); }, 50);
    }

    function closeSideMenu() {
        sideOverlay.classList.remove('active');
        sideMenu.classList.remove('active');
        btnSections.focus();
    }

    sideOverlay.addEventListener('click', closeSideMenu);

    sideItems.forEach(function (item) {
        item.addEventListener('click', function () {
            message.textContent = 'Обрано: ' + item.textContent;
            closeSideMenu();
        });
    });

    // --- Попап паролю ---
    function openPopup() {
        overlay.classList.add('active');
        passError.textContent = '';
        setTimeout(function () { passInput.focus(); }, 50);
    }

    function closePopup() {
        overlay.classList.remove('active');
        btnLogin.focus();
    }

    function tryLogin() {
        if (passInput.value === PASSWORD) {
            passError.textContent = '';
            closePopup();
            message.textContent = 'Вхід виконано успішно!';
        } else {
            passError.textContent = 'Невірний пароль';
            passInput.value = '';
            passInput.focus();
        }
    }

    btnConfirm.addEventListener('click', tryLogin);
    btnCancel.addEventListener('click', closePopup);

    // --- Навігація пультом ---
    document.addEventListener('keydown', function (e) {
        var code = e.keyCode;
        var active = document.activeElement;
        var isSideOpen  = sideMenu.classList.contains('active');
        var isPopupOpen = overlay.classList.contains('active');

        // Кнопка назад
        if (code === 27 || code === 461 || code === 10009) {
            if (isPopupOpen) { closePopup(); }
            else if (isSideOpen) { closeSideMenu(); }
            else { window.parent.postMessage({ type: 'lampa:back' }, '*'); }
            e.preventDefault();
            return;
        }

        // --- Попап ---
        if (isPopupOpen) {
            if (code === 13) {
                active === btnCancel ? closePopup() : tryLogin();
                e.preventDefault();
                return;
            }
            if (code === 40 && active === passInput) { btnConfirm.focus(); e.preventDefault(); return; }
            if (code === 38 && (active === btnConfirm || active === btnCancel)) { passInput.focus(); e.preventDefault(); return; }
            if (active === btnConfirm || active === btnCancel) {
                if (code === 39) { btnCancel.focus(); e.preventDefault(); }
                if (code === 37) { btnConfirm.focus(); e.preventDefault(); }
            }
            return;
        }

        // --- Бокове меню ---
        if (isSideOpen) {
            var si = sideItems.indexOf(active);
            if (code === 40) { sideItems[si < sideItems.length - 1 ? si + 1 : 0].focus(); e.preventDefault(); }
            if (code === 38) { sideItems[si > 0 ? si - 1 : sideItems.length - 1].focus(); e.preventDefault(); }
            if (code === 13 && si !== -1) { sideItems[si].click(); e.preventDefault(); }
            return;
        }

        // --- Головні кнопки ---
        var i = mainButtons.indexOf(active);
        if (code === 39) { mainButtons[i >= mainButtons.length - 1 ? 0 : i + 1].focus(); e.preventDefault(); }
        if (code === 37) { mainButtons[i <= 0 ? mainButtons.length - 1 : i - 1].focus(); e.preventDefault(); }
    });

    btnSections.focus();
</script>

</body>
</html>
