<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Привет</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        padding: 0;
        
        color: #fff;
        font-family: Arial, sans-serif;
        font-size: 16px;
    }

    .page {
        padding: 3em;
    }

    .message {
        font-size: 1.4em;
        margin-bottom: 1.5em;
        min-height: 1.5em;
        color: rgba(255,255,255,0.7);
    }

    .buttons {
        display: flex;
        gap: 1em;
    }

    /* Кнопки в стиле Lampa */
    .btn {
        padding: 0.9em 1.3em;
        border-radius: 0.7em;
        background: rgba(255,255,255,0.1);
        color: #fff;
        font-size: 1.2em;
        border: none;
        cursor: pointer;
        outline: none;
    }

    .btn:focus {
        background: #fff;
        color: #000;
    }

    /* Попап в стиле Lampa modal */
    .overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 50;
        align-items: center;
        justify-content: center;
    }

    .overlay.active {
        display: flex;
    }

    .popup {
        background: #262829;
        border-radius: 1em;
        padding: 2em;
        min-width: 18em;
    }

    .popup__title {
        font-size: 1.8em;
        font-weight: 300;
        margin-bottom: 1em;
    }

    .popup__input {
        width: 100%;
        padding: 0.7em 1em;
        border-radius: 0.5em;
        border: 0.12em solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.07);
        color: #fff;
        font-size: 1.1em;
        outline: none;
        margin-bottom: 1.2em;
    }

    .popup__input:focus {
        border-color: #fff;
    }

    .popup__error {
        color: #e74c3c;
        font-size: 1em;
        margin-bottom: 1em;
        min-height: 1.2em;
    }

    .popup__footer {
        display: flex;
        gap: 1em;
    }
</style>
</head>
<body>

<div class="page">
    <div class="message" id="message">Выберите действие</div>
    <div class="buttons">
        <button class="btn" id="btn1">Кнопка 1</button>
        <button class="btn" id="btn2">Кнопка 2</button>
        <button class="btn" id="btnLogin">Вход</button>
    </div>
</div>

<!-- Попап с паролем -->
<div class="overlay" id="overlay">
    <div class="popup">
        <div class="popup__title">Вход</div>
        <input class="popup__input" id="passInput" type="password" placeholder="Введите пароль">
        <div class="popup__error" id="passError"></div>
        <div class="popup__footer">
            <button class="btn" id="btnConfirm">Войти</button>
            <button class="btn" id="btnCancel">Отмена</button>
        </div>
    </div>
</div>

<script>
    var message   = document.getElementById('message');
    var btn1      = document.getElementById('btn1');
    var btn2      = document.getElementById('btn2');
    var btnLogin  = document.getElementById('btnLogin');
    var overlay   = document.getElementById('overlay');
    var passInput = document.getElementById('passInput');
    var passError = document.getElementById('passError');
    var btnConfirm = document.getElementById('btnConfirm');
    var btnCancel  = document.getElementById('btnCancel');

    var PASSWORD = '123';

    // Главные кнопки
    btn1.addEventListener('click', function () {
        message.textContent = 'Вы нажали Кнопку 1!';
    });

    btn2.addEventListener('click', function () {
        message.textContent = 'Вы нажали Кнопку 2!';
    });

    btnLogin.addEventListener('click', function () {
        openPopup();
    });

    // Попап
    function openPopup() {
        overlay.classList.add('active');
        passInput.value = '';
        passError.textContent = '';
        setTimeout(function () { passInput.focus(); }, 50);
    }

    function closePopup() {
        overlay.classList.remove('active');
        btnLogin.focus();
    }

    function tryLogin() {
        if (passInput.value === PASSWORD) {
            passError.textContent = '';
            closePopup();
            message.textContent = 'Вход выполнен успешно!';
        } else {
            passError.textContent = 'Неверный пароль';
            passInput.value = '';
            passInput.focus();
        }
    }

    btnConfirm.addEventListener('click', tryLogin);

    btnCancel.addEventListener('click', closePopup);

    // Навигация клавиатурой / пультом
    var mainButtons = [btn1, btn2, btnLogin];
    var popupButtons = [btnConfirm, btnCancel];

    document.addEventListener('keydown', function (e) {
        var code = e.keyCode;
        var isPopupOpen = overlay.classList.contains('active');

        // Кнопка назад
        if (code === 27 || code === 8 || code === 461 || code === 10009) {
            if (isPopupOpen) {
                closePopup();
            } else {
                window.parent.postMessage({ type: 'lampa:back' }, '*');
            }
            e.preventDefault();
            return;
        }

        // Enter в поле ввода
        if (code === 13 && isPopupOpen && document.activeElement === passInput) {
            tryLogin();
            return;
        }

        if (isPopupOpen) {
            // Навигация внутри попапа (стрелки между кнопками)
            var cur = popupButtons.indexOf(document.activeElement);
            if (code === 39 && cur !== -1) popupButtons[cur === popupButtons.length - 1 ? 0 : cur + 1].focus();
            if (code === 37 && cur !== -1) popupButtons[cur === 0 ? popupButtons.length - 1 : cur - 1].focus();
        } else {
            // Навигация по главным кнопкам
            var idx = mainButtons.indexOf(document.activeElement);
            if (code === 39) mainButtons[idx === mainButtons.length - 1 ? 0 : idx + 1].focus();
            if (code === 37) mainButtons[idx === 0 || idx === -1 ? mainButtons.length - 1 : idx - 1].focus();
        }
    });

    btn1.focus();
</script>

</body>
</html>
